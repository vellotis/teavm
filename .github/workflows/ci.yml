name: Build
on:
  pull_request:
  push:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        platform:
        - c
        #- js
        #- wasm
        #- wasi
        #- wasm-gc
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v3
      with:
        java-version: 21
        distribution: adopt
    - uses: actions/setup-node@v4
    - uses: gradle/gradle-build-action@v2
    - run: |
        gcc --version
        ldd --version
    - uses: addnab/docker-run-action@v3
      with:
        image: ghcr.io/catthehacker/ubuntu:act-24.04
        shell: bash
        options: -v ${{ github.workspace }}:/teavm -w /teavm
        run: |
            gcc --version
            ldd --version

            sudo apt update
            sudo apt install git gcc openjdk-21-jdk -y
            
            platforms=("c" "js" "wasm" "wasi" "wasm-gc")
            args=()
            for v in "${platforms[@]}"
            do
              if [[ "${{ matrix.platform }}" != "$v" ]]; then
                args+=("-Pteavm.tests.${v}=false")
              fi
            done
            # args+=("-Pteavm.localNodeJS=true")
            args+=("-Dorg.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m")
            echo "${args[@]}"
            sudo ./gradlew "${args[@]}" --stacktrace :tests:test
    - run: |
        platforms=("c" "js" "wasm" "wasi" "wasm-gc")
        args=()
        for v in "${platforms[@]}"
        do
          if [[ "${{ matrix.platform }}" != "$v" ]]; then
            args+=("-Pteavm.tests.${v}=false")
          fi
        done
        # args+=("-Pteavm.localNodeJS=true")
        args+=("-Dorg.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m")
        echo "${args[@]}"
        ./gradlew "${args[@]}" --stacktrace :tests:test
